<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e3b21">
<title>Juegos</title>
<style>
  :root{--tapete1:#1f7a43;--tapete2:#0e3b21;--oro:#f2c230;--texto:#f4f1e6;--suave:#cfe3d4}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;color:var(--texto);
    background:radial-gradient(ellipse at 50% 30%,var(--tapete1),var(--tapete2) 75%);background-color:var(--tapete2)}
  main{max-width:640px;margin:0 auto;padding:40px 16px}
  h1{font-family:Georgia,serif;color:var(--oro);margin:0 0 24px}
  a.juego{display:flex;gap:16px;align-items:center;padding:14px;border-radius:14px;background:rgba(0,0,0,.22);
    border:1px solid rgba(255,255,255,.15);color:inherit;text-decoration:none}
  a.juego:hover{border-color:var(--oro)}
  a.juego img{width:64px;height:100px;border-radius:6px}
  a.juego b{font-family:Georgia,serif;font-size:22px;display:block}
  a.juego span{color:var(--suave)}
</style>
</head>
<body>
<main>
  <h1>Juegos</h1>
  <a class="juego" href="juego-01/">
    <img src="juego-01/cartas/oros-1.webp" alt="">
    <div><b>Cuatro Palos</b><span>Lleva cada carta de la baraja española a su palo.</span></div>
  </a>
</main>
</body>
</html>
